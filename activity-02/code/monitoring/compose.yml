name: monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  grafana-vol:

services:
  node-exporter:
    image: prom/node-exporter:v1.12.0
    expose:
      - 9100
    networks:
      - monitoring
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.25"

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: prometheus
    ports:
      - 9090:9090
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
    networks:
      - monitoring
    depends_on:
      - node-exporter

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - 3000:3000
    volumes:
      - grafana-vol:/var/lib/grafana
    networks:
      - monitoring
    depends_on:
      - prometheus